# PostgreSQL local para desarrollo. La contraseña vive en .env (no se versiona); copia .env.example.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hito
      POSTGRES_USER: hito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hito -d hito"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
