# PostgreSQL desechable para la prueba en kind. Sin volumen persistente: el clúster vive lo que dura el job.
# La contraseña está en el Secret hito-db, que crea el flujo de CI con un valor aleatorio; no vive en el repositorio.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: hito
            - name: POSTGRES_USER
              value: hito
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hito-db
                  key: password
          readinessProbe:
            exec:
              # Por TCP y no por el socket: durante initdb, PostgreSQL solo escucha en el socket y aún no acepta conexiones de red.
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "hito", "-d", "hito"]
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: datos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
